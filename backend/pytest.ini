; 后端测试的唯一配置入口（2026-09-19 新增）。
;
; 在这之前 backend/ 下没有任何 pytest 配置文件，于是：testpaths 靠"恰好在
; backend/ 下跑"、警告一律静默、marker 写错名字也不会有人发现。约定全靠口头传，
; 没有任何机制强制。这份文件把那些约定写下来。
;
; 注意必须从 backend/ 目录跑（`cd backend && python -m pytest`）：测试 import
; `app.*`，而 `python -m` 会把当前目录放进 sys.path。这份配置不改变那一点。
;
; The single pytest config for the backend (added 2026-09-19). Before this there
; was none, so test discovery, warning policy and marker names were all
; conventions with nothing enforcing them. Run from backend/: the tests import
; `app.*` and `python -m` puts the working directory on sys.path.

[pytest]
testpaths = tests

; 警告即错误。写这条的时候全套测试一条警告都不产生，所以"零警告"是当前的真实
; 状态，不是一个需要慢慢收敛的目标——把它钉住，新的 DeprecationWarning（依赖
; 升级、Python 升级）会在引入的那一刻就被看见，而不是攒到某次升级时一起爆。
; 确有第三方噪音无法消除时，在下面按 `ignore:<消息正则>:<类别>` 逐条加，并写清
; 为什么——不要把整条 error 改回默认。
;
; Warnings are errors. The suite emits zero warnings today, so this pins the
; current reality rather than setting an aspiration: a new DeprecationWarning from
; a dependency or Python upgrade surfaces the moment it appears. Add narrow
; `ignore:` lines below with a reason if third-party noise ever becomes
; unavoidable; don't relax the blanket `error`.
filterwarnings =
    error
    ; app/routers/account.py 里的 `class Config:`（pydantic v1 写法）在 v2 下会告警，
    ; 而它是在 import 期触发的：不放行整个测试模块连收集都完不成。这是一条真实
    ; 待办（pydantic v3 会直接删掉这种写法），只是修它要动 schema/路由，不属于
    ; 这次审计修复的范围，所以在这里显式记一笔而不是悄悄放过。
    ; 修法：把 `class Config:` 换成 `model_config = ConfigDict(...)`，然后删掉这行。
    ; account.py's pydantic-v1-style `class Config:` warns under v2 at *import*
    ; time, so without this the module can't even be collected. A real to-do
    ; (v3 removes the syntax) that needs schema/router changes out of this audit's
    ; scope — recorded here rather than silently tolerated. Fix: swap to
    ; `model_config = ConfigDict(...)` and delete this line.
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ; starlette 0.46 的 testclient 在 import 期用了 anyio 4.11 起弃用的别名
    ; anyio.abc.BlockingPortal，新装环境（CI）装到最新 anyio 就会在收集阶段直接报错，
    ; 本地老版本 anyio 不会——2026-09-21 Tests 工作流第一次跑就是这么红的。只影响
    ; 测试客户端自身，不是我们的代码；starlette 升到改用 anyio.from_thread 的版本后删掉这行。
    ; starlette 0.46's testclient imports the anyio.abc.BlockingPortal alias that anyio
    ; 4.11 deprecates, so a fresh install (CI) fails at collection while an older local
    ; anyio does not. Test-client-only, not our code; drop once starlette moves on.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning

; marker 注册。未注册的 marker 在 --strict-markers 下会直接报错，避免
; `@pytest.mark.slwo` 这种拼错的装饰器静默变成"什么都不做"。
; Registered markers; --strict-markers turns a typo'd mark into an error instead
; of a silently inert decorator.
addopts = --strict-markers
markers =
    slow: 明显慢的用例（秒级以上），可用 `-m "not slow"` 跳过 / noticeably slow cases
    integration: 需要外部依赖（真实 Postgres / Redis）的用例，默认不跑 / needs external services

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Signal Lab · 离线</title>
    <!--
      离线兜底页。刻意是一个不依赖任何构建产物的独立 HTML：样式内联、无脚本、
      无外部字体——它要在「网络完全不可用」时渲染，任何一个外部请求都会让它自己
      也白屏。文件名不带内容 hash，Service Worker 才能用一个固定路径缓存它。

      两种语言同时显示而不是做 i18n：这里读不到 localStorage 里的语言偏好（页面
      由 SW 直接返回，没有跑应用代码），与其猜错，不如两句都写上，反正只有两行。

      Offline fallback page. Deliberately a standalone HTML with inlined styles, no
      scripts and no external fonts — it renders when the network is entirely
      unavailable, and any external request would leave it blank too. The filename
      carries no content hash so the service worker can cache it at a fixed path.

      Both languages are shown rather than translated: this page can't read the
      language preference (the SW serves it directly, no app code runs), and
      guessing wrong is worse than printing two short lines.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #09090B;
        color: #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", Roboto, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        min-height: 100vh;
        min-height: 100svh;
      }
      /* 与站内设计令牌对齐（tailwind.config.js「颜料，不是光」）：实色面、
         1px 发丝线、四档圆角（8 / 14 / 24）、九档字号（12 / 13 / 15 / 20），
         不再有霓虹光晕。这页没有构建产物可引，所以数值手抄。
         Aligned with the site's design tokens ("paint, not light"): solid
         surfaces, 1px hairlines, the 8/14/24 radius scale, the 12/13/15/20 type
         scale, no neon glow. Values are copied by hand — this page can't import
         build output. */
      .box { max-width: 380px; text-align: center; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 24px;
        border-radius: 50%;
        background: #1b1b21;
        border: 1px solid rgba(255, 255, 255, 0.12);
        position: relative;
      }
      .mark::after {
        content: ""; position: absolute; inset: 18px;
        border-radius: 50%; background: #5a22ee;
      }
      h1 { margin: 0 0 12px; font-size: 20px; font-weight: 700; letter-spacing: 0.01em; color: #EDEDF0; }
      p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: #B4B4BC; }
      p.en { color: #9C9CA6; font-size: 13px; }
      button {
        margin-top: 24px; padding: 10px 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: #5a22ee;
        color: #EDEDF0;
        font-size: 13px; font-weight: 500;
        font-family: inherit;
        cursor: pointer;
      }
      button:active { background: #4a1bc4; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark"></div>
      <h1>当前处于离线状态</h1>
      <p>网络连接断开了，暂时无法加载 Signal Lab。恢复网络后点下面的按钮重试。</p>
      <p class="en">You're offline. Reconnect and try again.</p>
      <button onclick="location.reload()">重新加载 · Reload</button>
    </div>
  </body>
</html>

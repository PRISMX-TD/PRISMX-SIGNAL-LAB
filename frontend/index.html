<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- 声明深色配色，让 Google 登录（GSI/FedCM）个性化按钮渲染为深色而非白底 / dark scheme so the GSI personalized button renders dark, not white -->
    <meta name="color-scheme" content="dark" />
    <!-- 产品决定：全平台（安卓/iOS，浏览器标签页/主屏幕 PWA）禁止双指与双击缩放，
         打开即按 width=device-width 自适应屏幕尺寸——原生 App 手感优先。
         user-scalable=no 在 Android Chrome 上生效；iOS Safari 从 10 起忽略这条
         viewport 声明本身，真正拦截靠 src/main.tsx 里的 gesturestart/touchend
         事件监听，这条 meta 只是 Android 一侧 + 声明性兜底。
         输入框字号需 ≥16px 以避免 iOS 聚焦时的自动放大跳变（缩放已被上面这条锁死，
         但聚焦仍会触发一次性的视口跳动，字号够大就不会触发）。
         viewport-fit=cover 配合 CSS 里已有的 env(safe-area-inset-*)，吃掉刘海屏边距。
         Product decision: disable pinch and double-tap zoom on every platform
         (Android/iOS, browser tab or Home-Screen PWA) — the page auto-fits the
         screen via width=device-width on load, and native-app feel wins here.
         user-scalable=no is honoured by Android Chrome; iOS Safari has ignored
         this viewport directive since iOS 10, so the real interception lives in
         the gesturestart/touchend listeners in src/main.tsx — this meta tag is
         the Android-side enforcement plus a declarative fallback.
         Inputs still need a >=16px font size to avoid iOS's focus-zoom jump
         (zoom itself is locked above, but focus can still trigger a one-off
         viewport jolt unless the font is large enough to not need it).
         viewport-fit=cover pairs with the env(safe-area-inset-*) already in the
         CSS to handle notched screens.
         interactive-widget=resizes-content：安卓 Chrome 108+ 默认只缩可视视口，软键盘
         盖在页面上、挡住底部的输入框与按钮；改成连布局视口一起缩，页面被挤到键盘上方。
         图表页高度 = Layout.tsx 实测的 --app-vh（visualViewport.height）− 顶栏 − 底栏
         （innerHeight − 底栏顶边），两者在这个模式下同步变化，算式不受影响。
         不认识这个键的内核（iOS、旧安卓）直接忽略。
         interactive-widget=resizes-content: Android Chrome 108+ otherwise shrinks
         only the visual viewport, so the keyboard covers bottom inputs/buttons; this
         resizes the layout viewport too. The chart page's height (--app-vh minus
         header and tab bar, measured in Layout.tsx) tracks both consistently.
         Engines that don't know the key ignore it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- Meta Pixel（Facebook 广告像素）。按 Meta 官方要求尽量靠 <head> 顶部放置：
         越早执行，越能在用户跳走之前完成上报，匹配率越高。放在 SEO/字体标签之前
         是刻意的——那些标签不影响渲染时序，而这段是异步注入外部脚本，早一点更好。

         ⚠️ 这段只负责首屏那一次 PageView。本站是 SPA（react-router 前端路由），
         点击导航不会重新加载页面，fbq 不会自动再发 PageView——路由切换的补发在
         src/components/MetaPixel.tsx 里，两者缺一不可。

         Meta Pixel base code, placed as high in <head> as practical per Meta's
         docs: the earlier it runs, the more events land before users navigate
         away. This fires PageView once on initial load only. This site is an SPA,
         so client-side route changes need a manual PageView — see
         src/components/MetaPixel.tsx. -->
    <!-- Meta Pixel Code -->
    <script>
      // 2026-09-25 起与 Meta 官方片段有两处不同：
      // ① 域名判断挪到最前面：非正式域名、原生 App（window.Capacitor，其 WebView 的
      //    hostname 是 localhost）一律连 fbq 桩都不装、fbevents.js 也不加载。原来 fbevents.js
      //    在任何域名上都会被插入——本地开发、预览域名、App 里都白白去连 connect.facebook.net，
      //    而那个域名在大陆是黑洞，挂着的请求会把 window load 一起拖住。
      // ② fbevents.js 延后到 load 之后的空闲时再插入：init / PageView 仍在这里同步进 fbq
      //    队列（时间戳不变），脚本到了再一并上报，只是不再和首屏抢网络。
      // MetaPixel.tsx 的路由补发按 fbq 是否存在判断，这里不装桩它就自然不发。
      // Since 2026-09-25 this differs from Meta's snippet in two ways: (1) the hostname
      // check comes first — off the production domain, or inside the native app
      // (window.Capacitor; its WebView hostname is localhost), neither the fbq stub nor
      // fbevents.js is installed (it used to be injected everywhere, hitting a host that
      // is black-holed from mainland China and holding up window load); (2) fbevents.js
      // is injected on idle after load — init / PageView still enter the fbq queue here
      // and are flushed once the script lands. MetaPixel.tsx checks fbq before firing.
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;var h=location.hostname;
      if(!/(^|\.)prismxsignallab\.com$/.test(h)||h==='localhost'||f.Capacitor)return;
      n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];
      n('init', '1386130166986351');
      n('track', 'PageView');
      var inject=function(){t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)};
      var later=function(){if(f.requestIdleCallback)f.requestIdleCallback(inject,{timeout:3000});
      else setTimeout(inject,1500)};
      if(b.readyState==='complete')later();else f.addEventListener('load',later)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    </script>
    <!-- End Meta Pixel Code -->
    <!-- 配套的 noscript 兜底像素放在 body 开头，不在这里——HTML 规范规定
         head 内的 noscript 只能包含 link/style/meta，放 img 会被
         严格解析器判为 disallowed-content-in-noscript-in-head 而构建失败
         （Vite 用 parse5，实测会直接报错）。Meta 官方片段默认整段贴进 head，
         这一点不合规，放 body 才是规范写法，功能完全一致。
         The companion noscript pixel lives at the top of body: per spec a
         a noscript in head may only contain link/style/meta, and an img
         there makes strict parsers (Vite uses parse5) fail the build. Meta's
         snippet assumes the whole block goes in head; splitting it is the
         spec-correct form and behaves identically. -->

    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />

    <!-- SEO 与社交分享卡片。没有这些标签时，把 prismxsignallab.com 发到 WhatsApp /
         Telegram / X / 小红书，对方看到的是一个没有标题、没有描述、没有配图的裸链接
         ——而口碑传播与 KOL 分享正是营销手册里 Phase 1 的主要打法。
         og:image 必须是绝对 URL（相对路径各家抓取器都不认），1200x630 是通用规格。
         lang 属性由 i18n 在语言切换时改写（见 src/i18n/index.ts），这里只给初值。
         SEO and social share cards. Without these, pasting prismxsignallab.com into
         WhatsApp / Telegram / X renders a bare URL with no title, description or
         image — while word-of-mouth and KOL sharing are the main Phase 1 channel in
         the marketing plan. og:image must be an absolute URL (crawlers don't
         resolve relative paths); 1200x630 is the universal size. The lang attribute
         is rewritten on language switch by i18n (see src/i18n/index.ts); this is
         only its initial value.
         SEO:BEGIN/END 之间的整块由预渲染脚本按「路由×语言」替换
         （scripts/prerender.mjs）；这里的内容是开发环境与模板的默认值（中文首页）。 -->
    <!-- SEO:BEGIN -->
    <title>Signal Lab · 信号实验室 · 从进阶到加冕 · by PRISMX</title>
    <meta name="description" content="聚合智能信号、数据复盘与竞技排位于一体的交易员赋能平台。每一笔经平台下的实盘单，都在为你的等级、勋章和名次记账。资金始终在你自己的券商账户。" />
    <link rel="canonical" href="https://www.prismxsignallab.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Signal Lab" />
    <meta property="og:url" content="https://www.prismxsignallab.com/" />
    <meta property="og:title" content="Signal Lab · 从进阶到加冕" />
    <meta property="og:description" content="聚合智能信号、数据复盘与竞技排位于一体的交易员赋能平台。每一笔经平台下的实盘单，都在为你的等级、勋章和名次记账。资金始终在你自己的券商账户。" />
    <meta property="og:image" content="https://www.prismxsignallab.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Signal Lab 信号实验室 · 情绪归零，只剩纪律" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Signal Lab · 从进阶到加冕" />
    <meta name="twitter:description" content="聚合智能信号、数据复盘与竞技排位于一体的交易员赋能平台。每一笔经平台下的实盘单，都在为你的等级、勋章和名次记账。资金始终在你自己的券商账户。" />
    <meta name="twitter:image" content="https://www.prismxsignallab.com/og-image.png" />
    <!-- SEO:END -->
    <!-- PWA manifest（display: standalone）。iOS 16.4+ 的 Web Push 只对"以独立
         模式从主屏幕启动"的 Web App 开放：没有这份 manifest 时，加到主屏幕的
         图标只是个 Safari 书签，打开后 Notification/PushManager 根本不存在，
         通知永远不可能出现。Android 端有了它才是可安装的真 PWA。
         PWA manifest (display: standalone). iOS 16.4+ only exposes Web Push to
         web apps launched standalone from the Home Screen: without this
         manifest the home-screen icon is just a Safari bookmark where
         Notification/PushManager don't exist at all. It also makes the app a
         real installable PWA on Android. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090B" />
    <!-- iOS 主屏幕 Web App 声明与图标（iOS 不读 manifest 的 icons，只认
         apple-touch-icon）/ iOS home-screen web-app declaration & icon (iOS
         ignores manifest icons; only apple-touch-icon is honored) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Signal Lab" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 字体：自托管，不再从 Google Fonts 拉。
         那条 <link rel="stylesheet"> 是 render-blocking 的，而该域名在中国大陆是
         黑洞（连接挂着不回）——首屏被卡几十秒，App 里更是启动白屏的唯一原因。
         @font-face 与取舍（为什么不带 Noto Sans SC）见 src/styles/fonts.css。
         Fonts are self-hosted; the old render-blocking Google Fonts link stalled
         first paint from mainland China. See src/styles/fonts.css. -->
    <!-- Google Identity Services（Google 登录 SDK）不再写在这里：改由
         components/GoogleLoginButton.tsx 在按钮挂载时动态插入（只插一次）。
         绝大多数页面根本没有登录按钮，而 accounts.google.com 在大陆连不通——
         挂在 head 里的这条外链会让每一页的 window load 都等它超时。
         GIS is no longer loaded here; GoogleLoginButton.tsx injects it once on
         mount. Most pages have no sign-in button, and this host is unreachable
         from mainland China, so a head script held up window load on every page. -->
  </head>
  <body>
    <!-- Meta Pixel 的无脚本兜底：JS 被禁用时靠这个 1x1 图片上报一次 PageView。
         必须放在 body（理由见 head 里那段说明）。
         Meta Pixel noscript fallback — reports one PageView when JS is disabled.
         Must live in body; see the note in <head> for why. -->
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        alt=""
        src="https://www.facebook.com/tr?id=1386130166986351&ev=PageView&noscript=1"
      />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

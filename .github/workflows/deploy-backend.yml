# 后端自动部署：推送到 main 且改动涉及 backend/ 时，SSH 到 VPS 执行 backend/scripts/deploy.sh
# （拉代码 → 需要时装依赖 → 重启 prismx → 健康检查，失败自动回滚）。
# 前端不经过这里：Vercel 自己监听 GitHub 推送。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配三个 secret：
#   VPS_HOST         VPS 公网 IP（具体地址见运维手册 2.2，不写进仓库：把生产源站 IP
#                    留在可见的仓库里，等于把「绕过 CDN 直打源站」和「对 22 端口定向
#                    爆破」的第一步白送出去）
#   VPS_SSH_KEY      专用部署密钥的私钥（ed25519，公钥已放进 VPS 上 ubuntu 用户的 authorized_keys）
#   VPS_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <VPS_HOST>` 的输出（固定主机指纹，防中间人）
# VPS 侧的一次性准备见运维手册《部署与上线进度》2.2 节。
#
# 部署前先跑后端测试（job test，步骤与 tests.yml 的 backend job 一致），不过不部署。
# 放在同一个工作流里用 needs 串起来，而不是等 tests.yml 的结果：两个工作流各自触发、
# 没有依赖关系，跨工作流等待（workflow_run）只在默认分支上生效、还拿不到路径过滤，
# 反而更绕。手动触发（workflow_dispatch）同样先测后部署。
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/tests/**"
      - "!backend/requirements-dev.txt"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

# 同一时间只跑一个部署；排队而不是取消，保证最后一次推送一定落地
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # 与 tests.yml 的 backend job 保持一致；改那边的安装/运行方式时这里跟着改。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        # -p no:cacheprovider：CI 机器是一次性的，别往工作区写 .pytest_cache。
        # PYTHONUTF8：与本地一致——.env 与注释里有中文，别让编码成为 CI 独有的失败原因。
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider

  deploy:
    # 测试红了就不部署。
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          : "${VPS_SSH_KEY:?缺少 secret VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?缺少 secret VPS_KNOWN_HOSTS}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          : "${VPS_HOST:?缺少 secret VPS_HOST}"
          # 远端命令：先 fetch，再把 origin/main 上最新的 deploy.sh 落到文件后执行
          #（不依赖 VPS 本地已有旧脚本）。注意必须落文件再 bash，不能 `git show ... | bash`：
          # 管道形式下 git show 失败时 bash 读到空输入照样退出 0，脚本没跑却报成功。
          # 若 authorized_keys 里配了 command="..." 强制命令，这里传什么都会被它覆盖，两种配置都能工作。
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              "ubuntu@${VPS_HOST}" \
              'cd ~/PRISMX-SIGNAL-LAB && git fetch -q origin main && git show origin/main:backend/scripts/deploy.sh > ~/.prismx-deploy.sh && bash ~/.prismx-deploy.sh'

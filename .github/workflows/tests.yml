# 测试守门：推送与 PR 时跑后端 / 桥接 / 前端三套测试。
#
# 这是仓库里第二个工作流。第一个（deploy-backend.yml）只管部署；在这之前，后端 1500+
# 个测试、桥接 60+ 个测试、以及那条防止四份品种别名表跑偏的检查（check_symbol_aliases，
# 挂在后端测试里），全部只在有人想起来手动跑的时候才跑。.gitignore 里那段把测试纳入仓库
# 的说明写的就是「测试留在本地等于没有」——测试进了库，守门的人却一直没上岗。
#
# 三个 job 互不依赖、并行跑：
#   backend  ubuntu，SQLite 内存库（conftest 自己建），不需要 Postgres / Redis——
#            标了 integration 的用例本来就默认不跑（见 backend/pytest.ini）。
#   bridge   必须 windows：requirements.txt 里的 MetaTrader5 只有 Windows wheel。
#            测试不需要真终端（mt5_worker 对 import 失败有兜底，测试全靠桩）。
#   frontend 与 `npm run build` 的前半段一致：check:sw → vitest → tsc。不跑 vite build
#            与预渲染（那是 Vercel 的活，几分钟的产物构建在这里只是重复烧时间）。
#
# 这里不部署、不需要任何 secret；deploy-backend.yml 的触发条件不受影响。
# 若要让部署等测试通过再跑，是下一步的事——先把「红了能看见」立起来。
#
# Test gate for pushes and PRs: backend / bridge / frontend, three independent jobs.
# Until now the 1500+ backend tests, 60+ bridge tests and the symbol-alias drift check
# only ran when someone remembered to. The bridge job is Windows-only because the
# MetaTrader5 wheel is; no live terminal is needed. Frontend mirrors the first half of
# `npm run build` (sw check → vitest → tsc) and skips the Vite build, which is Vercel's
# job. No secrets, no deploy; gating the deploy on this is a later step.
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "bridge/**"
      - "frontend/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "bridge/**"
      - "frontend/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        # -p no:cacheprovider：CI 机器是一次性的，别往工作区写 .pytest_cache。
        # PYTHONUTF8：与本地一致——.env 与注释里有中文，别让编码成为 CI 独有的失败原因。
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider

  bridge:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Service worker syntax
        run: npm run check:sw
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

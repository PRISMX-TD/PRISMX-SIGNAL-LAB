# api 站点的公共配置：主域名与备用域名的 server 块都 include 这一份，
# 只有 server_name 和证书不同。改转发/缓存规则只改这里。
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:20m;
ssl_session_timeout 1d;

access_log /var/log/nginx/edge-api.log edge;
client_max_body_size 20m;

# 公共的上游设置。⚠️ 所有 proxy_set_header 只写在这一层：location 里只要出现任何一条
# proxy_set_header，这一层的就全部不继承（Host / X-Forwarded-For 会悄悄丢掉）。
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host api.prismxsignallab.com;
# 覆盖而不是追加：不采信客户端自带的 X-Forwarded-For
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# 归一化后的压缩格式（见 prismx-edge.conf 的 $edge_ae）。⚠️ 只写在这一层，理由同上。
proxy_set_header Accept-Encoding $edge_ae;
proxy_ssl_server_name on;
proxy_ssl_name api.prismxsignallab.com;
proxy_ssl_session_reuse on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 10s;

# JSON 压缩（跨境那一段最贵的是字节）。
#   · 上游已经压过（后端 GZipMiddleware 回了 Content-Encoding）的响应，gzip 过滤器会原样放过，
#     不会二次压缩；
#   · WebSocket 握手是 101，gzip 只处理 200/403/404，/ws/client 不受影响；
#   · application/zip（热更新包）不在 gzip_types 里，不会被碰；
#   · gzip_proxied 管的是「请求里带 Via 的客户端」（前面还有一层代理，比如运营商透明代理），
#     不是上游。默认 off 会让这些用户拿不到压缩；设 any + gzip_vary on，中间缓存按
#     Accept-Encoding 分开存，不会把压缩版发给不认 gzip 的客户端。
gzip on;
gzip_types application/json text/plain;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;

# 下单请求后端最长等 160 秒（技术架构 §3.3），这里要比它长
proxy_read_timeout 180s;
proxy_send_timeout 180s;

location / {
    proxy_pass https://sg_api;
}

# WS：心跳 10 秒一次，读超时给足
location = /ws/client {
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_pass https://sg_api;
}

# App 热更新包：文件名就是 bundle id（<id>.zip，APP Pack 的 publish 严格递增生成、上传时
# 先传 zip 再传 manifest），同一个 URL 的内容永远不变，缓存 30 天。
# 上游的 Cache-Control/Expires 不作数：新加坡那边给的是静态文件默认头，按它来会三天两头
# 回源跨境拉 2~3MB。只在这个 location 忽略——manifest.json 不能这样缓存（见下）。
location ~ ^/updates/.+\.zip$ {
    proxy_cache prismx;
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    add_header X-Edge-Cache $upstream_cache_status;
    proxy_pass https://sg_api;
}
# 两个真正公开、与用户无关的接口：边缘缓存 15 秒。匿名落地页不再每次跨境回源，
# 后端重启 / 抖动的窗口里落地页也能照常显示定价与社媒链接（use_stale）。
#   · 带 Authorization 的请求一律直连、结果不入缓存（$edge_personal）。
#   · key 里带 $http_origin：后端的 CORS 中间件按请求的 Origin 回 Access-Control-Allow-Origin，
#     主域名 / 备用域名的页面会拿到不同的头，key 不区分就会把一个域名的头发给另一个。
#   · 带 Set-Cookie 的响应 nginx 默认不缓存；上游的 Cache-Control 不作数（15 秒是这里定的）。
location ~ ^/api/(payments/plans|site/social)$ {
    proxy_cache prismx;
    proxy_cache_key "$scheme$proxy_host$uri|$edge_ae|$http_origin";
    proxy_ignore_headers Cache-Control Expires;
    proxy_cache_valid 200 15s;
    proxy_cache_bypass $edge_personal;
    proxy_no_cache $edge_personal;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Edge-Cache $upstream_cache_status always;
    proxy_pass https://sg_api;
}

# manifest.json 决定有没有新版本，不缓存，直接转发

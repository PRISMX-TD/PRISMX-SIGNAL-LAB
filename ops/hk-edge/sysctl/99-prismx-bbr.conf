# 香港边缘节点的 TCP 调优：BBR + fq。
# 大陆用户线路有随机丢包，cubic 遇到丢包就把窗口砍半，30 Mbps 的口子用不满；
# BBR 按带宽和往返时延建模，对随机丢包不敏感。HK→SG 的常驻连接也受益。
# 只影响新建立的连接；回滚：删掉本文件与 /etc/modules-load.d/prismx-bbr.conf，
# 再 `sysctl -w net.ipv4.tcp_congestion_control=cubic net.core.default_qdisc=fq_codel`。
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

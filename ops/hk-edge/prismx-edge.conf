# PRISMX 香港边缘节点：只转发 + 缓存，不跑任何业务逻辑。
# 大陆用户经 DNS 境内线路到这里；API/WS 转发新加坡后端，前端从 Vercel 取并缓存。

proxy_cache_path /var/cache/nginx/prismx levels=1:2 keys_zone=prismx:50m
                 max_size=5g inactive=30d use_temp_path=off;

# 新加坡后端（Nginx 443）。常驻连接复用，省掉每个请求跨境重新握手。
upstream sg_api {
    server 43.134.110.47:443;
    keepalive 64;
    # 必须比新加坡那台 nginx 的 keepalive_timeout（默认 75s）短：由我们先关空闲连接。
    # 反过来的话，上游先关、我们恰好在那一刻往这条"已死"的连接上发请求，就是一次 502。
    keepalive_timeout 60s;
}

# Vercel 任播入口（任何 Vercel 域名都能从这两个 IP 进，靠 SNI + Host 区分）
upstream vercel {
    server 76.76.21.21:443;
    server 216.198.79.1:443 backup;
    keepalive 32;
}

# WebSocket 升级；普通请求 Connection 置空才能复用上游长连接
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Vercel 的 SPA 改写会把不存在的 /assets/xxx.js 也回成 app.html（200）。
# 这种 HTML 绝不能当成带哈希的产物缓存 30 天，也不能给浏览器发 immutable。
map $upstream_http_content_type $edge_is_html {
    default         0;
    ~*text/html     1;
}
map $upstream_http_content_type $edge_asset_cc {
    default         "public, max-age=31536000, immutable";
    ~*text/html     "no-cache";
}
# 字体 / 图标与 logo 的浏览器缓存头。同一个坑：/fonts/xxx 不存在时 Vercel 也回 app.html（200），
# 那份 HTML 绝不能带着一年的缓存头发给浏览器。
map $upstream_http_content_type $edge_font_cc {
    default         "public, max-age=31536000, immutable";
    ~*text/html     "no-cache";
}
map $upstream_http_content_type $edge_icon_cc {
    default         "public, max-age=86400";
    ~*text/html     "no-cache";
}

# 页面 HTML 的短缓存只给「与用户无关」的请求用。带 Authorization 的一律直连 Vercel、结果也不入缓存。
# 刻意**不**按 Cookie 绕过：www 是纯静态站，Vercel 不看 Cookie、回的 HTML 人人一样；而站上的
# Facebook 像素会给几乎每个浏览器种一个第一方 _fbp cookie，按 Cookie 绕过等于这层缓存（连同
# Vercel 出错时的兜底）对绝大多数人失效。缓存 key 也不含任何 Cookie（见 location / 的注释）。
map $http_authorization $edge_personal {
    default         1;
    ""              0;
}

log_format edge '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';

# ---------- HTTP：只做跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.prismxsignallab.com prismxsignallab.com www.prismxsignallab.com
                api.pmxsl.com pmxsl.com www.pmxsl.com;
    return 301 https://$host$request_uri;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ---------- 兜底：不是我们的域名一律拒绝 ----------
# 扫描器直接拿 IP 访问、到处探 /.env，别把它们转发给新加坡后端。
# TLS 阶段就拒绝握手（SNI 不匹配），不用为此准备证书。
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ---------- api.prismxsignallab.com → 新加坡 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.prismxsignallab.com;

    ssl_certificate     /etc/lego/certificates/prismx-edge.crt;
    ssl_certificate_key /etc/lego/certificates/prismx-edge.key;
    include /etc/nginx/snippets/prismx-api.conf;
}

# ---------- 裸域 → www（与 Vercel 现在的行为一致） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prismxsignallab.com;
    ssl_certificate     /etc/lego/certificates/prismx-edge.crt;
    ssl_certificate_key /etc/lego/certificates/prismx-edge.key;
    return 308 https://www.prismxsignallab.com$request_uri;
}

# ---------- www.prismxsignallab.com → Vercel（带缓存） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.prismxsignallab.com;

    ssl_certificate     /etc/lego/certificates/prismx-edge.crt;
    ssl_certificate_key /etc/lego/certificates/prismx-edge.key;
    include /etc/nginx/snippets/prismx-web.conf;
}

# ---------- 备用域名 pmxsl.com（主域名被封时用）：与主域名完全同一套转发 ----------
# 单独一张证书（pmxsl-edge），不和主域名合签：握手时发出去的证书里不出现 prismxsignallab.com，
# 探测备用域名的人从证书上看不出它和主域名是一家。上游仍然用主域名的 Host/SNI。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pmxsl.com;
    ssl_certificate     /etc/lego/certificates/pmxsl-edge.crt;
    ssl_certificate_key /etc/lego/certificates/pmxsl-edge.key;
    return 308 https://www.pmxsl.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pmxsl.com;

    ssl_certificate     /etc/lego/certificates/pmxsl-edge.crt;
    ssl_certificate_key /etc/lego/certificates/pmxsl-edge.key;
    include /etc/nginx/snippets/prismx-api.conf;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pmxsl.com;

    ssl_certificate     /etc/lego/certificates/pmxsl-edge.crt;
    ssl_certificate_key /etc/lego/certificates/pmxsl-edge.key;
    include /etc/nginx/snippets/prismx-web.conf;
}

# PRISMX 香港边缘节点：只转发 + 缓存，不跑任何业务逻辑。
# 大陆用户经 DNS 境内线路到这里；API/WS 转发新加坡后端，前端从 Vercel 取并缓存。

proxy_cache_path /var/cache/nginx/prismx levels=1:2 keys_zone=prismx:50m
                 max_size=5g inactive=30d use_temp_path=off;

# 新加坡后端（Nginx 443）。常驻连接复用，省掉每个请求跨境重新握手。
upstream sg_api {
    server 43.134.110.47:443;
    keepalive 64;
    # 必须比新加坡那台 nginx 的 keepalive_timeout（默认 75s）短：由我们先关空闲连接。
    # 反过来的话，上游先关、我们恰好在那一刻往这条"已死"的连接上发请求，就是一次 502。
    keepalive_timeout 60s;
}

# Vercel 任播入口（任何 Vercel 域名都能从这两个 IP 进，靠 SNI + Host 区分）
upstream vercel {
    server 76.76.21.21:443;
    server 216.198.79.1:443 backup;
    keepalive 32;
}

# WebSocket 升级；普通请求 Connection 置空才能复用上游长连接
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Vercel 的 SPA 改写会把不存在的 /assets/xxx.js 也回成 app.html（200）。
# 这种 HTML 绝不能当成带哈希的产物缓存 30 天，也不能给浏览器发 immutable。
map $upstream_http_content_type $edge_is_html {
    default         0;
    ~*text/html     1;
}
map $upstream_http_content_type $edge_asset_cc {
    default         "public, max-age=31536000, immutable";
    ~*text/html     "no-cache";
}
# 字体 / 图标与 logo 的浏览器缓存头。同一个坑：/fonts/xxx 不存在时 Vercel 也回 app.html（200），
# 那份 HTML 绝不能带着一年的缓存头发给浏览器。
map $upstream_http_content_type $edge_font_cc {
    default         "public, max-age=31536000, immutable";
    ~*text/html     "no-cache";
}
map $upstream_http_content_type $edge_icon_cc {
    default         "public, max-age=86400";
    ~*text/html     "no-cache";
}

# 页面 HTML 的短缓存只给「与用户无关」的请求用。带 Authorization 的一律直连 Vercel、结果也不入缓存。
# 刻意**不**按 Cookie 绕过：www 是纯静态站，Vercel 不看 Cookie、回的 HTML 人人一样；而站上的
# Facebook 像素会给几乎每个浏览器种一个第一方 _fbp cookie，按 Cookie 绕过等于这层缓存（连同
# Vercel 出错时的兜底）对绝大多数人失效。缓存 key 也不含任何 Cookie（见 location / 的注释）。
map $http_authorization $edge_personal {
    default         1;
    ""              0;
}

log_format edge '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';

# ---------- HTTP：只做跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.prismxsignallab.com prismxsignallab.com www.prismxsignallab.com;
    return 301 https://$host$request_uri;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ---------- 兜底：不是我们三个域名的一律拒绝 ----------
# 扫描器直接拿 IP 访问、到处探 /.env，别把它们转发给新加坡后端。
# TLS 阶段就拒绝握手（SNI 不匹配），不用为此准备证书。
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ---------- api.prismxsignallab.com → 新加坡 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.prismxsignallab.com;

    ssl_certificate     /etc/lego/certificates/prismx-edge.crt;
    ssl_certificate_key /etc/lego/certificates/prismx-edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/edge-api.log edge;
    client_max_body_size 20m;

    # 公共的上游设置。⚠️ 所有 proxy_set_header 只写在这一层：location 里只要出现任何一条
    # proxy_set_header，这一层的就全部不继承（Host / X-Forwarded-For 会悄悄丢掉）。
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host api.prismxsignallab.com;
    # 覆盖而不是追加：不采信客户端自带的 X-Forwarded-For
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name api.prismxsignallab.com;
    proxy_ssl_session_reuse on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;

    # JSON 压缩（跨境那一段最贵的是字节）。
    #   · 上游已经压过（后端 GZipMiddleware 回了 Content-Encoding）的响应，gzip 过滤器会原样放过，
    #     不会二次压缩；
    #   · WebSocket 握手是 101，gzip 只处理 200/403/404，/ws/client 不受影响；
    #   · application/zip（热更新包）不在 gzip_types 里，不会被碰；
    #   · gzip_proxied 管的是「请求里带 Via 的客户端」（前面还有一层代理，比如运营商透明代理），
    #     不是上游。默认 off 会让这些用户拿不到压缩；设 any + gzip_vary on，中间缓存按
    #     Accept-Encoding 分开存，不会把压缩版发给不认 gzip 的客户端。
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # 下单请求后端最长等 160 秒（技术架构 §3.3），这里要比它长
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass https://sg_api;
    }

    # WS：心跳 10 秒一次，读超时给足
    location = /ws/client {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_pass https://sg_api;
    }

    # App 热更新包：文件名就是 bundle id（<id>.zip，APP Pack 的 publish 严格递增生成、上传时
    # 先传 zip 再传 manifest），同一个 URL 的内容永远不变，缓存 30 天。
    # 上游的 Cache-Control/Expires 不作数：新加坡那边给的是静态文件默认头，按它来会三天两头
    # 回源跨境拉 2~3MB。只在这个 location 忽略——manifest.json 不能这样缓存（见下）。
    location ~ ^/updates/.+\.zip$ {
        proxy_cache prismx;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Edge-Cache $upstream_cache_status;
        proxy_pass https://sg_api;
    }
    # manifest.json 决定有没有新版本，不缓存，直接转发
}

# ---------- 裸域 → www（与 Vercel 现在的行为一致） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prismxsignallab.com;
    ssl_certificate     /etc/lego/certificates/prismx-edge.crt;
    ssl_certificate_key /etc/lego/certificates/prismx-edge.key;
    return 308 https://www.prismxsignallab.com$request_uri;
}

# ---------- www.prismxsignallab.com → Vercel（带缓存） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.prismxsignallab.com;

    ssl_certificate     /etc/lego/certificates/prismx-edge.crt;
    ssl_certificate_key /etc/lego/certificates/prismx-edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/edge-web.log edge;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host www.prismxsignallab.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_ssl_server_name on;
    proxy_ssl_name www.prismxsignallab.com;
    proxy_ssl_session_reuse on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 10s;

    # 页面 HTML（app.html 与各条 SPA 路由、预渲染页、robots/sitemap 等）：边缘只缓存 30 秒，
    # 发版最多晚 30 秒可见；换来的是 Vercel 抖动或挂掉时继续给旧页面（use_stale），
    # 以及同一时刻大量请求只回源一次（lock + background_update）。
    #   · Vercel 给 HTML 的是 `max-age=0, must-revalidate`，不忽略它就一份都存不下；它原样透传给
    #     浏览器，浏览器照旧每次回来问边缘。
    #   · 带 Set-Cookie 的响应 nginx 默认不缓存（这里刻意没把 Set-Cookie 放进 ignore 列表）。
    #   · 缓存 key 显式写出来：scheme + 上游 + 完整 URI，不含任何 Cookie / 请求头。
    location / {
        proxy_cache prismx;
        proxy_cache_key $scheme$proxy_host$request_uri;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $edge_personal;
        proxy_no_cache $edge_personal;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Edge-Cache $upstream_cache_status always;
        proxy_pass https://vercel;
    }

    # Service Worker 与 Web App Manifest：一律不缓存。sw.js 被边缘多拿住 30 秒，浏览器就可能
    # 装上旧 SW、再按旧 SW 的缓存策略把旧页面钉住更久；两者都是"发版是否生效"的开关。
    location = /sw.js {
        proxy_pass https://vercel;
    }
    location = /manifest.webmanifest {
        proxy_pass https://vercel;
    }
    # vercel.json 的改写刻意放过了 /api；眼下 www 上没有任何函数，但哪天有了，它的响应多半
    # 与用户相关——先把它排除在上面的 HTML 短缓存之外。
    location /api/ {
        proxy_pass https://vercel;
    }

    # Vite 打包产物：文件名带哈希，内容永不变 → 边缘缓存 30 天，浏览器也永久缓存
    location /assets/ {
        proxy_cache prismx;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_no_cache $edge_is_html;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control $edge_asset_cc;
        add_header X-Edge-Cache $upstream_cache_status always;
        proxy_pass https://vercel;
    }

    # 字体：文件名带字重/字符集范围，换字体就换文件名 → 浏览器长缓存（与 vercel.json 的
    # /fonts/ 规则一致；Vercel 实际回的是 max-age=0，这里在边缘补上），边缘缓存 7 天。
    location /fonts/ {
        proxy_cache prismx;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_no_cache $edge_is_html;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control $edge_font_cc;
        add_header X-Edge-Cache $upstream_cache_status always;
        proxy_pass https://vercel;
    }

    # 图标、logo（logo.png / logo-128.png / logo-256.webp 这类）、分享图：文件名不带哈希，
    # 可能原地替换 → 浏览器 1 天，边缘 1 小时；Vercel 出问题时继续给旧的。
    location ~ ^/icons/|^/(logo[^/]*\.(png|webp|svg)|og-image\.png)$ {
        proxy_cache prismx;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_no_cache $edge_is_html;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control $edge_icon_cc;
        add_header X-Edge-Cache $upstream_cache_status always;
        proxy_pass https://vercel;
    }
}

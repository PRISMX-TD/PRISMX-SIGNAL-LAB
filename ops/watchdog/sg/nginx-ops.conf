# PRISMX 看门狗运维接口：管理后台「重启后端」「重启 gateway」按钮走这里，不经过后端。
# 由 install.sh 放到 /etc/nginx/snippets/prismx-ops.conf；在 api 域名的 server { } 里加一行
#     include snippets/prismx-ops.conf;
# 然后 sudo nginx -t && sudo systemctl reload nginx。
# 看门狗只听 127.0.0.1:8790；鉴权（登录 token + 运维口令）、锁定、冷却都在看门狗里做。
location /ops/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    # 经香港边缘节点进来的请求，realip 模块已把 $remote_addr 还原成用户真实 IP；
    # 看门狗按它做「输错锁定」。
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 4k;
}
